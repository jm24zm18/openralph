[project]
name = "openralph"
version = "0.1.0"
description = "OpenRalph: a self-contained CLI orchestrator for OpenCode with repo memory, gates, git checkpoints, and skills."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12.0",
  "rich>=13.7.0",
  "tomli>=2.0.1; python_version < '3.11'",
]

[project.scripts]
openralph = "openralph.openralph_cli.cli:app"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["openralph*"]

[tool.setuptools.package-data]
openralph = ["templates/*.md"]
